<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rizvy | Full Stack Web Developer</title>
    <meta
      name="description"
      content="Portfolio of Rizvy, a Full Stack Web Developer building fast, modern and accessible web apps with React, Next.js, Node.js and MongoDB."
    />
    <meta name="theme-color" content="#07070d" />
    <meta property="og:title" content="Rizvy | Full Stack Web Developer" />
    <meta property="og:description" content="Fast, modern and accessible web apps." />
    <meta property="og:type" content="website" />
    <link rel="icon" href="/images/logo.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap"
      rel="stylesheet"
    />

    <!-- Applies saved theme before the page paints (prevents flash) -->
    <script>
      try {
        var t = localStorage.getItem("theme");
        if (t) document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
